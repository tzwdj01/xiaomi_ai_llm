<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小爱音箱 · 控制台</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#203147;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1300px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 18px}p{line-height:1.6}.sub,.hint{font-size:13px;color:#8291a2}.pill{background:#def5ec;color:#168760;border-radius:22px;padding:8px 15px;font-size:13px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #e9eef5;border-radius:18px;padding:22px;box-shadow:0 5px 25px #293a5410}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7f9fc;border-radius:12px;padding:14px;min-height:83px}.stat label{display:block;color:#8291a2;font-size:12px;margin-bottom:8px}.stat b{font-size:15px;word-break:break-all}.bars{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.meter{height:8px;background:#edf1f7;border-radius:5px;overflow:hidden}.meter i{display:block;background:#5c82ee;height:100%;border-radius:5px}.line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.chat{height:390px;overflow:auto;background:#f8fafc;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:86%;padding:10px 13px;border-radius:14px;background:white;line-height:1.6;box-shadow:0 1px 5px #101a2d0a;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.me{align-self:flex-end;background:#e5edff}.bubble small{display:block;color:#95a3b1;font-size:11px}.bubble.live{border:1px solid #a5bbff}form{display:grid;grid-template-columns:1fr 1fr;gap:14px}form label{font-size:13px;color:#687991}select,input{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #dfe6ef;border-radius:9px;background:#fff;color:#213249;font:inherit}button{background:#537bea;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:14px;cursor:pointer}button:disabled{opacity:.6}.span{grid-column:1/-1}.warning{background:#fff8e8;color:#96712e;padding:11px;border-radius:10px;font-size:12px}.msg{font-size:13px;color:#4773d8}.detail{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f4f8;font-size:14px}.detail span{color:#8795a5}.tag{font-size:11px;color:#5681ee;background:#edf3ff;padding:5px 9px;border-radius:15px} @media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.wrap{padding:16px}}
</style></head><body><div class="wrap"><header><div><h1>小爱音箱 <span style="color:#5c82ee">控制台</span></h1><p class="sub">设备状态、对话和设置，集中在这里</p></div><div id="online" class="pill">正在连接</div></header><div class="grid"><section class="panel"><h2>设备概览 <span class="tag">MDZ-25-DA</span></h2><div class="stats" id="stats"></div><div class="bars" id="bars"></div><div id="hardware"></div></section><section class="panel"><h2>对话动态</h2><p class="hint">合成中的文字会尽量提前显示；原生记录可能不完整。记录随音箱重启清空。</p><div class="chat" id="chat"><span class="hint">等待连接音箱…</span></div></section><section class="panel" style="grid-column:1/-1"><h2>模型与声音设置</h2><p class="hint">选择模型后填写该服务的 API Key；留空保留已保存的密钥。保存会短暂重启语音助手。</p><form id="form"><label>模型服务<select id="backend"><option value="deepseek">DeepSeek</option><option value="glm">智谱 GLM</option><option value="kimi">Kimi</option><option value="minimax">MiniMax</option><option value="custom">其他 OpenAI 兼容接口</option></select></label><label>联网搜索<select id="search"><option value="auto">自动判断是否搜索</option><option value="off">关闭</option></select></label><label>模型名称（留空使用项目默认值）<input id="model" placeholder="例如 deepseek-flash"></label><label>接口地址（留空使用项目默认值）<input id="url" placeholder="https://…"></label><label>API Key <span id="keyStatus" class="hint"></span><input id="key" type="password" autocomplete="new-password" placeholder="留空则保留已保存的密钥"></label><label>回答声音<select id="voice"><option value="zh-CN-XiaoxiaoNeural">晓晓 · 女声</option><option value="zh-CN-XiaoyiNeural">晓伊 · 女声</option><option value="zh-CN-YunjianNeural">云健 · 男声</option></select></label><label>追问等待时间 <span class="hint">回答后等待开口的时间</span><input id="wait" type="number" min="5" max="10" step="1" required> 秒</label><div class="warning span">联网搜索仅适用于项目的 DeepSeek 直连模式；其他模型是否可用取决于对应平台和账号。自定义接口需要填写 HTTPS 地址、模型名称及密钥。</div><div class="span"><button id="save">保存并应用</button> <span id="message" class="msg"></span></div></form></section></div><p class="hint">仅在这台 Mac 上访问 · 音箱地址变化时需更新 SSH 连接配置</p></div><script>
const token='__TOKEN__',q=s=>document.querySelector(s),form=q('#form');if(!['127.0.0.1','localhost'].includes(location.hostname)){q('#key').disabled=true;q('#key').placeholder='请在 Mac 本机打开看板后填写密钥';let warning=document.createElement('p');warning.className='warning';warning.textContent='局域网访问未加密，请仅在可信的家庭 Wi‑Fi 使用；API Key 请在 Mac 本机设置。';document.querySelector('header').after(warning);}let initial=false,dirty=false,last='',state={};const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const size=k=>k>=1048576?(k/1048576).toFixed(2)+' GB':(k/1024).toFixed(0)+' MB';function stat(label,v){return `<div class="stat"><label>${label}</label><b>${escapeHtml(v||'未知')}</b></div>`}function bar(title,used,total){let pct=total?Math.max(0,Math.min(100,used/total*100)):0;return `<div><div class="line"><span>${title}</span><span>${size(used)} / ${size(total)}</span></div><div class="meter"><i style="width:${pct}%"></i></div></div>`}function keyInfo(){let b=q('#backend').value,k={deepseek:'DEEPSEEK_API_KEY',glm:'GLM_API_KEY',kimi:'KIMI_API_KEY',minimax:'MINIMAX_API_KEY',custom:'LLM_API_KEY'}[b];q('#keyStatus').textContent=state.keys?.[k]==='1'?'（已设置）':'（尚未设置）'}q('#backend').addEventListener('change',()=>{q('#model').value='';q('#url').value='';q('#key').value='';});form.addEventListener('input',()=>{dirty=true;keyInfo()});form.addEventListener('change',()=>{dirty=true;keyInfo()});async function refresh(){try{let d=await(await fetch('/data',{cache:'no-store'})).json();if(!d.online)throw Error(d.error);state=d;q('#online').textContent='● 已连接';q('#online').style.background='#def5ec';let w=d.wifi,m=d.memory,storage=d.disk.find(x=>x.mount==='/data');q('#stats').innerHTML=stat('系统版本',d.version)+stat('Wi‑Fi',w.ssid)+stat('音箱地址',w.ip_address)+stat('连接状态',w.wpa_state==='COMPLETED'?'已连接':'未连接');q('#bars').innerHTML=bar('运行内存',m.MemTotal-m.MemAvailable,m.MemTotal)+(storage?bar('可写存储 /data',storage.used,storage.total):'');q('#hardware').innerHTML=`<div class="detail"><span>设备型号</span><b>小米 AI 音箱 · S12A</b></div><div class="detail"><span>主芯片</span><b>Amlogic A113X · ${escapeHtml(d.cores)} 核</b></div><div class="detail"><span>无线芯片</span><b>Broadcom 4345 系列</b></div><div class="detail"><span>闪存分区总容量</span><b>${(d.flash/1048576).toFixed(0)} MB</b></div><div class="detail"><span>无线频段</span><b>${Number(w.freq)<3000?'2.4 GHz':'5 GHz'}</b></div>`;if(!initial&&!dirty){let c=d.config;q('#backend').value=['deepseek','glm','kimi','minimax'].includes(c.BACKEND)?c.BACKEND:'custom';q('#search').value=c.LLM_WEB_SEARCH==='off'?'off':'auto';q('#voice').value=c.DEVICE_TTS_VOICE||'zh-CN-XiaoxiaoNeural';q('#wait').value=c.FOLLOWUP_TIMEOUT||'8';q('#model').value=c.LLM_MODEL||'';q('#url').value=c.LLM_API_BASE||'';initial=true}keyInfo();let ev=[...d.events,...d.speaking.map(t=>({role:'AI',text:t,source:'正在合成',live:true}))];let now=JSON.stringify(ev);if(now!==last){let el=q('#chat'),bottom=el.scrollHeight-el.scrollTop-el.clientHeight<60;el.innerHTML=ev.length?ev.map(e=>`<div class="bubble ${e.role==='我'?'me':''} ${e.live?'live':''}"><small>${escapeHtml(e.role)} · ${escapeHtml(e.source)}</small>${escapeHtml(e.text)}</div>`).join(''):'<span class="hint">对音箱说句话，内容会出现在这里</span>';if(bottom||!last)el.scrollTop=el.scrollHeight;last=now}}catch(e){q('#online').textContent='● 未连接';q('#online').style.background='#ffeded';q('#message').textContent='连接失败，请检查音箱是否在线。'}}form.addEventListener('submit',async e=>{e.preventDefault();let btn=q('#save');btn.disabled=true;q('#message').textContent='正在保存，请稍候…';try{let x={wait:Number(q('#wait').value),backend:q('#backend').value,search:q('#search').value,voice:q('#voice').value,model:q('#model').value,url:q('#url').value,key:q('#key').value};let r=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(x)}),v=await r.json();if(!v.ok)throw Error(v.error);q('#key').value='';dirty=false;initial=false;q('#message').textContent='保存成功，助手已重新启动。';refresh()}catch(e){q('#message').textContent='保存失败：'+e.message}finally{btn.disabled=false}});refresh();setInterval(refresh,2000);
</script></body></html>
